name: snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0969da
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58a6ff

      - name: Slow the snake down
        run: |
          python3 - <<'EOF'
          import pathlib, re
          for f in pathlib.Path("dist").glob("*.svg"):
              svg = f.read_text(encoding="utf-8")
              svg = re.sub(r"(\d+(?:\.\d+)?)ms", lambda m: f"{float(m.group(1)) * 2:g}ms", svg)
              f.write_text(svg, encoding="utf-8")
          EOF

      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update contribution snake"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:output
